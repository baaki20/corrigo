name: Publish scheduled Corrigo dossiers

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Publish dossiers that are due
        env:
          CORRIGO_SITE_URL: ${{ secrets.CORRIGO_SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$CORRIGO_SITE_URL"
          test -n "$CRON_SECRET"
          curl --fail --silent --show-error --retry 3 --retry-delay 5 --retry-all-errors --write-out '\nHTTP status: %{http_code}\n' --request POST \
            "$CORRIGO_SITE_URL/api/cron/publish" \
            --header "Authorization: Bearer $CRON_SECRET"
