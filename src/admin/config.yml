backend:
  name: git-gateway
  branch: main

# Netlify Identity + Git Gateway handles login for free — no extra server needed.
# You'll turn this on in the Netlify dashboard after deploying (see README).

media_folder: "src/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "posts"
    label: "Posts"
    folder: "src/posts"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Platform", name: "platform", widget: "select", options: ["Instagram", "YouTube", "TikTok", "Other"], required: false }
      - { label: "Original post/video URL", name: "videoUrl", widget: "string", required: false }
      - { label: "The claim being addressed", name: "claim", widget: "text" }
      - label: "Sources"
        name: "sources"
        widget: "list"
        required: false
        fields:
          - { label: "Label", name: "label", widget: "string", required: false }
          - { label: "URL", name: "url", widget: "string" }
      - { label: "Evidence / body", name: "body", widget: "markdown" }
